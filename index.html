<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>FocusTube</title>

<style>

:root {
  --bg: #f4f1ea;
  --surface: rgba(255,255,255,0.72);
  --surface-solid: #ffffff;
  --surface-soft: rgba(255,255,255,0.45);

  --text: #191a1c;
  --muted: #74746f;

  --line: rgba(25,25,25,0.08);

  --accent: #9b7044;
  --accent-soft: rgba(155,112,68,0.12);

  --shadow:
    0 12px 35px rgba(38,34,27,0.08),
    0 2px 8px rgba(38,34,27,0.04);

  --radius: 18px;
}

body.dark {

  --bg: #0e100f;
  --surface: rgba(25,27,25,0.76);
  --surface-solid: #191b19;
  --surface-soft: rgba(35,37,34,0.55);

  --text: #ecebe5;
  --muted: #9b9c96;

  --line: rgba(255,255,255,0.07);

  --accent: #d5a86d;
  --accent-soft: rgba(213,168,109,0.12);

  --shadow:
    0 18px 45px rgba(0,0,0,0.32),
    0 2px 10px rgba(0,0,0,0.18);
}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: var(--text);
  background: var(--bg);

  min-height: 100vh;

  transition:
    background 0.35s ease,
    color 0.35s ease;

  overflow-x: hidden;
}


/* =========================================================
   AMBIENT BACKGROUND
   ========================================================= */

.ambient {
  position: fixed;
  inset: -20%;
  pointer-events: none;
  z-index: -2;

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(214,173,112,0.15),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(130,150,130,0.10),
      transparent 28%
    );

  filter: blur(40px);

  animation:
    ambientMove 18s ease-in-out infinite alternate;
}

body.dark .ambient {
  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(215,164,94,0.10),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(100,130,115,0.07),
      transparent 28%
    );
}

@keyframes ambientMove {

  from {
    transform: translate3d(-2%, -1%, 0) scale(1);
  }

  to {
    transform: translate3d(2%, 2%, 0) scale(1.04);
  }
}


/* subtle paper texture */

.texture {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;

  opacity: 0.035;

  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {

  position: sticky;
  top: 0;

  height: 70px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 22px;

  z-index: 50;

  background:
    color-mix(
      in srgb,
      var(--bg) 76%,
      transparent
    );

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border-bottom: 1px solid var(--line);
}

.brand {

  display: flex;
  align-items: center;
  gap: 10px;

  font-size: 16px;
  font-weight: 500;

  letter-spacing: -0.3px;
}

.brand-dot {

  width: 10px;
  height: 10px;

  border-radius: 50%;

  background: var(--accent);

  box-shadow:
    0 0 18px rgba(180,130,75,0.35);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {

  width: 40px;
  height: 40px;

  border: 0;
  border-radius: 12px;

  background: var(--surface);

  color: var(--text);

  cursor: pointer;

  box-shadow: var(--shadow);

  font-size: 17px;

  transition:
    transform .18s ease,
    background .18s ease;
}

.icon-btn:active {
  transform: scale(.94);
}


/* =========================================================
   APP CONTAINER
   ========================================================= */

.app {

  width: min(1180px, 100%);

  margin: 0 auto;

  padding:
    0 22px 80px;
}


/* =========================================================
   HOME
   ========================================================= */

.home {

  min-height: calc(100vh - 70px);

  display: flex;
  flex-direction: column;

  justify-content: center;

  padding:
    50px 0 90px;
}

.greeting {

  color: var(--muted);

  font-size: 14px;

  margin-bottom: 10px;
}

.home-title {

  font-size: clamp(34px, 5vw, 58px);

  font-weight: 400;

  letter-spacing: -2.4px;

  line-height: 1.04;

  max-width: 720px;

  margin: 0 0 34px;
}

.home-title span {
  color: var(--muted);
}


/* =========================================================
   SEARCH
   ========================================================= */

.search-wrap {

  width: min(760px, 100%);
}

.search-box {

  display: flex;
  align-items: center;

  min-height: 62px;

  padding: 6px;

  border-radius: 18px;

  background: var(--surface);

  border: 1px solid var(--line);

  box-shadow: var(--shadow);

  backdrop-filter: blur(16px);
}

.search-box input {

  flex: 1;

  min-width: 0;

  border: 0;
  outline: 0;

  background: transparent;

  color: var(--text);

  padding: 0 16px;

  font-size: 16px;

  font-family: inherit;
}

.search-box input::placeholder {
  color: var(--muted);
}

.search-button {

  border: 0;

  min-height: 50px;

  padding: 0 22px;

  border-radius: 14px;

  background: var(--text);

  color: var(--bg);

  font-family: inherit;

  font-weight: 500;

  cursor: pointer;
}


/* =========================================================
   HOME SECTIONS
   ========================================================= */

.home-section {

  margin-top: 58px;
}

.section-header {

  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 18px;
}

.section-title {

  font-size: 15px;

  font-weight: 500;

  letter-spacing: -0.2px;
}

.section-link {

  color: var(--muted);

  font-size: 13px;

  cursor: pointer;
}


/* =========================================================
   CONTINUE CARD
   ========================================================= */

.continue-card {

  width: 100%;

  display: grid;

  grid-template-columns: minmax(220px, 0.75fr) 1fr;

  overflow: hidden;

  border-radius: 20px;

  background: var(--surface);

  border: 1px solid var(--line);

  box-shadow: var(--shadow);

  cursor: pointer;
}

.continue-thumb {

  aspect-ratio: 16/9;

  width: 100%;

  object-fit: cover;
}

.continue-info {

  padding: 26px;

  display: flex;

  flex-direction: column;

  justify-content: center;
}

.continue-label {

  color: var(--muted);

  font-size: 12px;

  margin-bottom: 10px;
}

.continue-title {

  font-size: 20px;

  line-height: 1.35;

  margin-bottom: 8px;
}

.progress-track {

  height: 4px;

  width: 100%;

  margin-top: 18px;

  border-radius: 20px;

  background: var(--line);

  overflow: hidden;
}

.progress-bar {

  height: 100%;

  width: 0%;

  background: var(--accent);
}


/* =========================================================
   TODAY FOCUS
   ========================================================= */

.focus-card {

  display: flex;

  align-items: center;

  gap: 22px;

  padding: 24px;

  border-radius: 20px;

  background: var(--surface);

  border: 1px solid var(--line);

  box-shadow: var(--shadow);
}

.focus-number {

  font-size: 34px;

  font-weight: 400;

  letter-spacing: -1px;
}

.focus-label {

  color: var(--muted);

  font-size: 13px;
}


/* =========================================================
   PAGE HEADER
   ========================================================= */

.page-header {

  padding: 42px 0 26px;
}

.page-title {

  font-size: 30px;

  font-weight: 400;

  letter-spacing: -1px;

  margin: 0;
}

.page-subtitle {

  color: var(--muted);

  margin-top: 7px;

  font-size: 13px;
}


/* =========================================================
   VIDEO GRID
   ========================================================= */

.video-grid {

  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 26px 20px;
}

.video-card {

  min-width: 0;

  cursor: pointer;
}

.thumbnail-wrap {

  position: relative;

  overflow: hidden;

  border-radius: 15px;

  background: #111;

  aspect-ratio: 16/9;

  box-shadow: var(--shadow);
}

.thumbnail {

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

  transition:
    transform .35s ease;
}

.video-card:hover .thumbnail {

  transform: scale(1.025);
}

.duration {

  position: absolute;

  right: 8px;
  bottom: 8px;

  padding: 4px 6px;

  border-radius: 6px;

  background: rgba(0,0,0,.75);

  color: white;

  font-size: 11px;
}

.video-info {

  padding: 12px 2px;
}

.video-title {

  font-size: 14px;

  line-height: 1.4;

  font-weight: 500;

  display: -webkit-box;

  -webkit-line-clamp: 2;

  -webkit-box-orient: vertical;

  overflow: hidden;
}

.channel-name {

  margin-top: 7px;

  color: var(--muted);

  font-size: 12px;

  cursor: pointer;

  width: fit-content;
}

.channel-name:hover {
  color: var(--accent);
}

.video-meta {

  margin-top: 6px;

  color: var(--muted);

  font-size: 11px;
}

.video-description {

  margin-top: 8px;

  color: var(--muted);

  font-size: 11px;

  line-height: 1.45;

  display: -webkit-box;

  -webkit-line-clamp: 2;

  -webkit-box-orient: vertical;

  overflow: hidden;
}


/* =========================================================
   LOAD MORE
   ========================================================= */

.load-more-wrap {

  display: flex;

  justify-content: center;

  padding: 45px 0;
}

.load-more {

  border: 1px solid var(--line);

  background: var(--surface);

  color: var(--text);

  border-radius: 14px;

  padding: 12px 22px;

  font-family: inherit;

  cursor: pointer;

  box-shadow: var(--shadow);
}


/* =========================================================
   PLAYER
   ========================================================= */

.player {

  display: none;

  padding: 24px 0 60px;
}

.player.active {
  display: block;
}

.player-shell {

  border-radius: 20px;

  overflow: hidden;

  background: #000;

  box-shadow:
    0 25px 70px rgba(0,0,0,.20);
}

.player-frame {

  width: 100%;

  aspect-ratio: 16/9;

  display: block;

  border: 0;
}

.player-details {

  padding: 24px 0;
}

.player-title {

  font-size: 23px;

  line-height: 1.35;

  font-weight: 500;
}

.player-channel {

  color: var(--muted);

  margin-top: 8px;

  font-size: 13px;
}

.player-actions {

  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  margin-top: 18px;
}

.action {

  border: 1px solid var(--line);

  background: var(--surface);

  color: var(--text);

  padding: 10px 15px;

  border-radius: 12px;

  font-family: inherit;

  cursor: pointer;
}

.action.active {

  background: var(--accent-soft);

  color: var(--accent);

  border-color: transparent;
}


/* =========================================================
   CHANNEL PAGE
   ========================================================= */

.channel-header {

  padding: 40px 0 28px;

  border-bottom: 1px solid var(--line);

  margin-bottom: 28px;
}

.channel-title {

  font-size: 32px;

  font-weight: 400;

  letter-spacing: -1px;

  margin: 0;
}

.channel-description {

  max-width: 650px;

  color: var(--muted);

  line-height: 1.6;

  font-size: 13px;

  margin-top: 10px;
}


/* =========================================================
   LIBRARY
   ========================================================= */

.library-tabs {

  display: flex;

  gap: 8px;

  flex-wrap: wrap;

  margin-bottom: 25px;
}

.library-tab {

  border: 1px solid var(--line);

  background: var(--surface);

  color: var(--muted);

  padding: 9px 14px;

  border-radius: 11px;

  font-family: inherit;

  cursor: pointer;
}

.library-tab.active {

  background: var(--text);

  color: var(--bg);
}


/* =========================================================
   DRAWER
   ========================================================= */

.drawer-overlay {

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,.25);

  backdrop-filter: blur(3px);

  z-index: 80;

  display: none;
}

.drawer-overlay.open {
  display: block;
}

.drawer {

  position: fixed;

  top: 0;
  left: 0;

  height: 100vh;

  width: min(310px, 88vw);

  background: var(--surface-solid);

  border-right: 1px solid var(--line);

  z-index: 81;

  padding: 25px;

  transform: translateX(-105%);

  transition: transform .3s ease;

  box-shadow: 15px 0 50px rgba(0,0,0,.12);
}

.drawer.open {
  transform: translateX(0);
}

.drawer-brand {

  font-size: 17px;

  margin-bottom: 35px;
}

.drawer-item {

  display: flex;

  align-items: center;

  gap: 12px;

  padding: 13px 10px;

  border-radius: 11px;

  color: var(--muted);

  cursor: pointer;

  font-size: 14px;
}

.drawer-item:hover {

  background: var(--accent-soft);

  color: var(--text);
}

.drawer-divider {

  height: 1px;

  background: var(--line);

  margin: 18px 0;
}


/* =========================================================
   EMPTY / LOADING
   ========================================================= */

.empty {

  padding: 80px 20px;

  text-align: center;

  color: var(--muted);

  font-size: 14px;
}

.loading {

  padding: 60px 20px;

  text-align: center;

  color: var(--muted);
}


/* =========================================================
   TOAST
   ========================================================= */

.toast {

  position: fixed;

  bottom: 25px;
  left: 50%;

  transform:
    translateX(-50%)
    translateY(20px);

  opacity: 0;

  pointer-events: none;

  background: var(--text);

  color: var(--bg);

  padding: 11px 16px;

  border-radius: 12px;

  font-size: 12px;

  z-index: 200;

  transition: .25s ease;
}

.toast.show {

  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 900px) {

  .video-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 650px) {

  .app {
    padding-left: 15px;
    padding-right: 15px;
  }

  .topbar {
    padding: 0 15px;
  }

  .home {
    min-height: auto;
    padding-top: 90px;
  }

  .home-title {
    font-size: 40px;
  }

  .continue-card {
    grid-template-columns: 1fr;
  }

  .video-grid {
    grid-template-columns: 1fr;
    gap: 28px;
  }

  .player-title {
    font-size: 19px;
  }
}

</style>
</head>
<body>

<div class="ambient"></div>
<div class="texture"></div>

<header class="topbar">

  <div class="brand">

    <span class="brand-dot"></span>

    <span>FocusTube</span>

  </div>


  <div class="top-actions">

    <button
      class="icon-btn"
      onclick="toggleTheme()"
      aria-label="Toggle theme">

      ◐

    </button>

    <button
      class="icon-btn"
      onclick="openDrawer()"
      aria-label="Open menu">

      ☰

    </button>

  </div>

</header>


<div
  class="drawer-overlay"
  id="drawerOverlay"
  onclick="closeDrawer()">
</div>


<aside class="drawer" id="drawer">

  <div class="drawer-brand">
    FocusTube
  </div>


  <div
    class="drawer-item"
    onclick="goHome()">

    ⌂
    Home

  </div>


  <div
    class="drawer-item"
    onclick="openLibrary('watchlater')">

    🔖
    Watch Later

  </div>


  <div
    class="drawer-item"
    onclick="openLibrary('liked')">

    ♡
    Liked

  </div>


  <div
    class="drawer-item"
    onclick="openLibrary('history')">

    ◷
    History

  </div>


  <div class="drawer-divider"></div>


  <div
    class="drawer-item"
    onclick="toggleTheme()">

    ◐
    Light / Dark

  </div>

</aside>


<div class="app">


  <section id="homeView" class="home">

    <div class="greeting" id="greeting">
      Good evening.
    </div>

    <h1 class="home-title">

      What would you like
      <span>to learn?</span>

    </h1>


    <div class="search-wrap">

      <div class="search-box">

        <input
          id="searchInput"
          type="text"
          autocomplete="off"
          placeholder="Search something..."
          onkeydown="handleSearchKey(event)"
        >

        <button
          class="search-button"
          onclick="performSearch()">

          Search

        </button>

      </div>

    </div>


    <div
      id="continueSection"
      class="home-section"
      style="display:none;">

      <div class="section-header">

        <div class="section-title">
          Continue studying
        </div>

        <div
          class="section-link"
          onclick="openLibrary('history')">

          View history →

        </div>

      </div>


      <div
        id="continueCard"
        class="continue-card">
      </div>

    </div>


    <div class="home-section">

      <div class="section-header">

        <div class="section-title">
          Today's focus
        </div>

      </div>


      <div class="focus-card">

        <div
          class="focus-number"
          id="focusTime">

          0m

        </div>

        <div>

          <div class="focus-label">
            study time today
          </div>

        </div>

      </div>

    </div>

  </section>


  <section id="contentView" style="display:none;">

    <div class="page-header">

      <h2
        class="page-title"
        id="pageTitle">
      </h2>

      <div
        class="page-subtitle"
        id="pageSubtitle">
      </div>

    </div>


    <div
      id="contentArea">
    </div>

  </section>


  <section
    id="playerView"
    class="player">

    <div
      class="player-shell">

      <iframe
        id="youtubePlayer"
        class="player-frame"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>

    </div>


    <div class="player-details">

      <div
        class="player-title"
        id="playerTitle">
      </div>

      <div
        class="player-channel"
        id="playerChannel">
      </div>


      <div class="player-actions">

        <button
          class="action"
          id="likeButton"
          onclick="toggleLike()">

          ♡ Like

        </button>


        <button
          class="action"
          id="watchLaterButton"
          onclick="toggleWatchLater()">

          🔖 Watch Later

        </button>


        <button
          class="action"
          onclick="closePlayer()">

          ← Back

        </button>

      </div>

    </div>

  </section>

</div>


<div
  class="toast"
  id="toast">
</div> 
<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const API_KEY = "AIzaSyCLA90IAgFZvueuFw3fRbUb70N2OpDQtsQ";


/* =========================================================
   STATE
   ========================================================= */

let nextPageToken = "";

let currentQuery = "";

let currentChannel = null;

let currentVideo = null;

let currentVideoPosition = 0;

let playerTimer = null;

let currentLibrary = "watchlater";


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function getJSON(key, fallback) {

  try {

    return JSON.parse(
      localStorage.getItem(key)
    ) || fallback;

  } catch {

    return fallback;

  }

}


function setJSON(key, value) {

  localStorage.setItem(
    key,
    JSON.stringify(value)
  );

}


let watchLater =
  getJSON("ft_watchlater", []);

let liked =
  getJSON("ft_liked", []);

let history =
  getJSON("ft_history", []);

let progress =
  getJSON("ft_progress", {});


/* =========================================================
   BASIC HELPERS
   ========================================================= */

const $ = id =>
  document.getElementById(id);


function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value || "";

  return div.innerHTML;

}


function toast(message) {

  const el = $("toast");

  el.textContent = message;

  el.classList.add("show");

  setTimeout(() => {

    el.classList.remove("show");

  }, 1800);

}


/* =========================================================
   GREETING
   ========================================================= */

function updateGreeting() {

  const hour =
    new Date().getHours();

  let text =
    "Good evening.";

  if (hour < 12) {

    text =
      "Good morning.";

  } else if (hour < 18) {

    text =
      "Good afternoon.";

  }

  $("greeting").textContent =
    text;

}


/* =========================================================
   THEME
   ========================================================= */

function loadTheme() {

  const theme =
    localStorage.getItem("ft_theme");

  if (theme === "dark") {

    document.body.classList.add("dark");

  }

}


function toggleTheme() {

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "ft_theme",
    document.body.classList.contains("dark")
      ? "dark"
      : "light"
  );

}


/* =========================================================
   DRAWER
   ========================================================= */

function openDrawer() {

  $("drawer").classList.add("open");

  $("drawerOverlay").classList.add("open");

}


function closeDrawer() {

  $("drawer").classList.remove("open");

  $("drawerOverlay").classList.remove("open");

}


/* =========================================================
   HOME
   ========================================================= */

function goHome() {

  closeDrawer();

  $("homeView").style.display =
    "flex";

  $("contentView").style.display =
    "none";

  $("playerView").classList.remove(
    "active"
  );

  updateContinueCard();

}


/* =========================================================
   SEARCH
   ========================================================= */

function handleSearchKey(event) {

  if (event.key === "Enter") {

    performSearch();

  }

}


async function performSearch(loadMore = false) {

  const query =
    $("searchInput").value.trim();

  if (!query) return;


  if (!loadMore) {

    currentQuery = query;

    currentChannel = null;

    nextPageToken = "";

    $("homeView").style.display =
      "none";

    $("playerView").classList.remove(
      "active"
    );

    $("contentView").style.display =
      "block";

    $("pageTitle").textContent =
      "Search results";

    $("pageSubtitle").textContent =
      query;

    $("contentArea").innerHTML =
      `<div class="loading">
        Searching...
      </div>`;

  }


  let url =
    "https://www.googleapis.com/youtube/v3/search" +
    "?part=snippet" +
    "&type=video" +
    "&order=relevance" +
    "&maxResults=50" +
    "&q=" +
    encodeURIComponent(query) +
    "&key=" +
    API_KEY;


  if (nextPageToken) {

    url +=
      "&pageToken=" +
      encodeURIComponent(
        nextPageToken
      );

  }


  try {

    const response =
      await fetch(url);

    const data =
      await response.json();


    if (data.error) {

      showAPIError(data.error);

      return;

    }


    nextPageToken =
      data.nextPageToken || "";


    if (!loadMore) {

      $("contentArea").innerHTML =
        `<div class="video-grid"
              id="videoGrid">
        </div>

        <div
          class="load-more-wrap"
          id="loadMoreWrap">
        </div>`;

    }


    const grid =
      $("videoGrid");


    const ids =
      data.items
        .map(item =>
          item.id.videoId
        )
        .filter(Boolean);


    if (!ids.length) {

      grid.innerHTML =
        `<div class="empty">
          No videos found.
        </div>`;

      return;

    }


    /*
      Second API request gets:
      duration + views
    */

    const detailURL =
      "https://www.googleapis.com/youtube/v3/videos" +
      "?part=contentDetails,statistics" +
      "&id=" +
      ids.join(",") +
      "&key=" +
      API_KEY;


    const detailResponse =
      await fetch(detailURL);

    const detailData =
      await detailResponse.json();


    const details = {};

    detailData.items.forEach(item => {

      details[item.id] = item;

    });


    data.items.forEach(item => {

      const detail =
        details[item.id.videoId];

      /*
        Hide obvious Shorts.

        We remove videos:
        - containing #shorts
        - <= 180 seconds
      */

      const duration =
        detail
          ? parseDuration(
              detail.contentDetails.duration
            )
          : 0;

      const title =
        item.snippet.title
          .toLowerCase();

      if (
        title.includes("#shorts") ||
        (duration > 0 && duration <= 180)
      ) {

        return;

      }


      renderVideoCard(
        item,
        detail,
        grid
      );

    });


    updateLoadMoreButton(
      () => performSearch(true)
    );


  } catch (error) {

    $("contentArea").innerHTML =
      `<div class="empty">
        Something went wrong while searching.
        Check your internet connection and API key.
      </div>`;

  }

}


/* =========================================================
   CHANNEL
   ========================================================= */

    const detailResponse =
      await fetch(detailURL);

    const detailData =
      await detailResponse.json();


    const details = {};

    detailData.items.forEach(item => {

      details[item.id] = item;

    });


    data.items.forEach(item => {

      const detail =
        details[item.id.videoId];

      const duration =
        detail
          ? parseDuration(
              detail.contentDetails.duration
            )
          : 0;

      const title =
        item.snippet.title
          .toLowerCase();

      if (
        title.includes("#shorts") ||

      ) {

      }

/* =========================================================
   VIDEO CARD
   ========================================================= */

function renderVideoCard(
  item,
  detail,
  grid
) {

  const videoId =
    item.id.videoId;

  if (!videoId) return;


  const card =
    document.createElement("article");

  card.className =
    "video-card";


  const duration =
    detail
      ? formatSeconds(
          parseDuration(
            detail.contentDetails.duration
          )
        )
      : "";


  const views =
    detail
      ? formatViews(
          Number(
            detail.statistics.viewCount || 0
          )
        )
      : "";


  const description =
    item.snippet.description || "";


  card.innerHTML = `

    <div class="thumbnail-wrap">

      <img
        class="thumbnail"
        src="${item.snippet.thumbnails.high
          ? item.snippet.thumbnails.high.url
          : item.snippet.thumbnails.medium.url}"
        loading="lazy"
        alt="">

      ${
        duration
          ? `<div class="duration">
              ${duration}
             </div>`
          : ""
      }

    </div>


    <div class="video-info">

      <div class="video-title">
        ${escapeHTML(
          item.snippet.title
        )}
      </div>


      <div
        class="channel-name">

        ${escapeHTML(
          item.snippet.channelTitle
        )}

      </div>


      <div class="video-meta">

        ${views}
        ${views && duration ? " • " : ""}
        ${duration}

      </div>


      <div class="video-description">

        ${escapeHTML(
          description
        )}

      </div>

    </div>

  `;


  card
    .querySelector(".thumbnail-wrap")
    .onclick = () => {

      playVideo({
        id: videoId,

        title:
          item.snippet.title,

        channel:
          item.snippet.channelTitle,

        channelId:
          item.snippet.channelId,

        thumbnail:
          item.snippet.thumbnails.high
            ? item.snippet.thumbnails.high.url
            : item.snippet.thumbnails.medium.url
      });

    };


  card
    .querySelector(".channel-name")
    .onclick = event => {

      event.stopPropagation();

      loadChannel(
        item.snippet.channelId,
        item.snippet.channelTitle
      );

    };


  grid.appendChild(card);

}


/* =========================================================
   PAGINATION
   ========================================================= */

function updateLoadMoreButton(callback) {

  const wrap =
    $("loadMoreWrap");

  if (!wrap) return;


  wrap.innerHTML = "";


  if (!nextPageToken) return;


  const button =
    document.createElement("button");

  button.className =
    "load-more";

  button.textContent =
    "Load more";

  button.onclick =
    callback;


  wrap.appendChild(button);

} 
/* =========================================================
   PLAYER
   ========================================================= */

function playVideo(video) {

  currentVideo =
    video;


  localStorage.setItem(
    "ft_current_video",
    JSON.stringify(video)
  );


  $("homeView").style.display =
    "none";

  $("contentView").style.display =
    "none";

  $("playerView").classList.add(
    "active"
  );


  $("playerTitle").textContent =
    video.title;

  $("playerChannel").textContent =
    video.channel;


  updateActionButtons();


  /*
    YouTube embedded player.

    The saved position is supplied
    when the player loads.
  */

  const savedPosition =
    Number(
      progress[video.id] || 0
    );


  currentVideoPosition =
    savedPosition;


  $("youtubePlayer").src =
    "https://www.youtube.com/embed/" +
    encodeURIComponent(video.id) +
    "?enablejsapi=1" +
    "&autoplay=1" +
    "&rel=0" +
    "&modestbranding=1" +
    "&playsinline=1" +
    "&start=" +
    Math.floor(savedPosition);


  addToHistory(video);


  startProgressSaving();

}


/* =========================================================
   PLAYER PROGRESS
   ========================================================= */

function startProgressSaving() {

  clearInterval(
    playerTimer
  );


  /*
    Because browser security prevents
    directly reading an iframe's internal
    video time, we use YouTube's player
    messaging API.
  */

  playerTimer =
    setInterval(() => {

      if (!currentVideo) return;

      const iframe =
        $("youtubePlayer");

      if (!iframe) return;


      iframe.contentWindow.postMessage(
        JSON.stringify({

          event: "command",

          func: "getCurrentTime",

          args: []

        }),
        "https://www.youtube.com"
      );

    }, 5000);

}


window.addEventListener(
  "message",
  event => {

    if (
      event.origin !==
      "https://www.youtube.com"
    ) return;


    try {

      const data =
        typeof event.data === "string"
          ? JSON.parse(event.data)
          : event.data;


      if (
        data &&
        data.event === "infoDelivery" &&
        data.info &&
        typeof data.info.currentTime ===
          "number"
      ) {

        currentVideoPosition =
          data.info.currentTime;


        if (currentVideo) {

          progress[
            currentVideo.id
          ] =
            currentVideoPosition;

          setJSON(
            "ft_progress",
            progress
          );

        }

      }

    } catch {

      /* ignore messages that aren't JSON */

    }

  }
);


/* =========================================================
   CLOSE PLAYER
   ========================================================= */

function closePlayer() {

  clearInterval(
    playerTimer
  );


  if (currentVideo) {

    localStorage.setItem(
      "ft_current_video",
      JSON.stringify(
        currentVideo
      )
    );

  }


  $("youtubePlayer").src =
    "";


  $("playerView").classList.remove(
    "active"
  );


  currentVideo =
    null;


  goHome();

}


/* =========================================================
   LIKES
   ========================================================= */

function toggleLike() {

  if (!currentVideo) return;


  const index =
    liked.findIndex(
      v => v.id === currentVideo.id
    );


  if (index >= 0) {

    liked.splice(index, 1);

    toast("Removed from liked");

  } else {

    liked.unshift(
      currentVideo
    );

    toast("Added to liked");

  }


  setJSON(
    "ft_liked",
    liked
  );


  updateActionButtons();

}


/* =========================================================
   WATCH LATER
   ========================================================= */

function toggleWatchLater() {

  if (!currentVideo) return;


  const index =
    watchLater.findIndex(
      v => v.id === currentVideo.id
    );


  if (index >= 0) {

    watchLater.splice(
      index,
      1
    );

    toast("Removed from Watch Later");

  } else {

    watchLater.unshift(
      currentVideo
    );

    toast("Saved to Watch Later");

  }


  setJSON(
    "ft_watchlater",
    watchLater
  );


  updateActionButtons();

}


/* =========================================================
   ACTION BUTTON STATE
   ========================================================= */

function updateActionButtons() {

  if (!currentVideo) return;


  const likedAlready =
    liked.some(
      v => v.id === currentVideo.id
    );


  const savedAlready =
    watchLater.some(
      v => v.id === currentVideo.id
    );


  const likeButton =
    $("likeButton");

  const watchButton =
    $("watchLaterButton");


  likeButton.classList.toggle(
    "active",
    likedAlready
  );


  watchButton.classList.toggle(
    "active",
    savedAlready
  );


  likeButton.textContent =
    likedAlready
      ? "♥ Liked"
      : "♡ Like";


  watchButton.textContent =
    savedAlready
      ? "✓ Saved"
      : "🔖 Watch Later";

}


/* =========================================================
   HISTORY
   ========================================================= */

function addToHistory(video) {

  history =
    history.filter(
      v => v.id !== video.id
    );


  history.unshift({

    ...video,

    watchedAt:
      Date.now()

  });


  /*
    Keep the most recent 100 videos.
  */

  history =
    history.slice(0, 100);


  setJSON(
    "ft_history",
    history
  );


  updateContinueCard();

}


/* =========================================================
   LIBRARY
   ========================================================= */

function openLibrary(type) {

  closeDrawer();

  currentLibrary =
    type;


  $("homeView").style.display =
    "none";

  $("playerView").classList.remove(
    "active"
  );

  $("contentView").style.display =
    "block";


  let title =
    "Watch Later";

  let subtitle =
    "Videos you've saved for later.";

  let items =
    watchLater;


  if (type === "liked") {

    title =
      "Liked";

    subtitle =
      "Videos you've liked on FocusTube.";

    items =
      liked;

  }


  if (type === "history") {

    title =
      "History";

    subtitle =
      "Your recent learning history.";

    items =
      history;

  }


  $("pageTitle").textContent =
    title;

  $("pageSubtitle").textContent =
    subtitle;


  $("contentArea").innerHTML =
    `

    <div class="library-tabs">

      <button
        class="library-tab
        ${type === "watchlater"
          ? "active"
          : ""}"
        onclick="openLibrary('watchlater')">

        Watch Later

      </button>


      <button
        class="library-tab
        ${type === "liked"
          ? "active"
          : ""}"
        onclick="openLibrary('liked')">

        Liked

      </button>


      <button
        class="library-tab
        ${type === "history"
          ? "active"
          : ""}"
        onclick="openLibrary('history')">

        History

      </button>

    </div>


    <div
      class="video-grid"
      id="libraryGrid">
    </div>

    `;


  const grid =
    $("libraryGrid");


  if (!items.length) {

    grid.innerHTML =
      `<div class="empty">
        Nothing here yet.
      </div>`;

    return;

  }


  items.forEach(video => {

    renderLibraryCard(
      video,
      grid
    );

  });

}


/* =========================================================
   LIBRARY CARD
   ========================================================= */

function renderLibraryCard(
  video,
  grid
) {

  const card =
    document.createElement("article");

  card.className =
    "video-card";


  card.innerHTML = `

    <div class="thumbnail-wrap">

      <img
        class="thumbnail"
        src="${escapeHTML(
          video.thumbnail
        )}"
        loading="lazy">

    </div>


    <div class="video-info">

      <div class="video-title">

        ${escapeHTML(
          video.title
        )}

      </div>


      <div class="channel-name">

        ${escapeHTML(
          video.channel
        )}

      </div>

    </div>

  `;


  card
    .querySelector(".thumbnail-wrap")
    .onclick = () => {

      playVideo(video);

    };


  grid.appendChild(card);

}


/* =========================================================
   CONTINUE STUDYING
   ========================================================= */

function updateContinueCard() {

  const section =
    $("continueSection");

  if (!history.length) {

    section.style.display =
      "none";

    return;

  }


  const video =
    history[0];


  section.style.display =
    "block";


  const position =
    Number(
      progress[video.id] || 0
    );


  const card =
    $("continueCard");


  card.innerHTML = `

    <img
      class="continue-thumb"
      src="${escapeHTML(
        video.thumbnail
      )}">


    <div class="continue-info">

      <div class="continue-label">
        Continue studying
      </div>


      <div class="continue-title">

        ${escapeHTML(
          video.title
        )}

      </div>


      <div class="focus-label">

        ${escapeHTML(
          video.channel
        )}

      </div>


      <div class="progress-track">

        <div
          class="progress-bar"
          style="width:${Math.min(
            100,
            position / 60
          )}%">

        </div>

      </div>

    </div>

  `;


  card.onclick =
    () => playVideo(video);

}


/* =========================================================
   TODAY'S FOCUS
   ========================================================= */

function updateFocusTime() {

  const today =
    new Date()
      .toISOString()
      .slice(0, 10);


  const stored =
    getJSON(
      "ft_daily_time",
      {}
    );


  const seconds =
    stored[today] || 0;


  $("focusTime").textContent =
    formatSeconds(seconds);

}


/* =========================================================
   TIME HELPERS
   ========================================================= */

function parseDuration(
  iso
) {

  if (!iso) return 0;


  const match =
    iso.match(
      /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/
    );


  if (!match) return 0;


  const hours =
    Number(match[1] || 0);

  const minutes =
    Number(match[2] || 0);

  const seconds =
    Number(match[3] || 0);


  return (
    hours * 3600 +
    minutes * 60 +
    seconds
  );

}


function formatSeconds(
  seconds
) {

  seconds =
    Math.max(
      0,
      Math.floor(seconds)
    );


  const hours =
    Math.floor(
      seconds / 3600
    );


  const minutes =
    Math.floor(
      (seconds % 3600) / 60
    );


  const secs =
    seconds % 60;


  if (hours) {

    return (
      hours +
      "h " +
      minutes +
      "m"
    );

  }


  if (minutes) {

    return (
      minutes +
      "m"
    );

  }


  return (
    secs +
    "s"
  );

}


function formatViews(
  views
) {

  if (!views) return "";


  if (views >= 1000000000) {

    return (
      (views / 1000000000)
        .toFixed(1)
        .replace(".0", "") +
      "B views"
    );

  }


  if (views >= 1000000) {

    return (
      (views / 1000000)
        .toFixed(1)
        .replace(".0", "") +
      "M views"
    );

  }


  if (views >= 1000) {

    return (
      (views / 1000)
        .toFixed(1)
        .replace(".0", "") +
      "K views"
    );

  }


  return (
    views +
    " views"
  );

}


/* =========================================================
   API ERROR
   ========================================================= */

function showAPIError(error) {

  let message =
    "YouTube search couldn't be completed.";


  if (
    error.reason ===
    "quotaExceeded"
  ) {

    message =
      "The YouTube API daily quota has been reached.";

  }


  if (
    error.reason ===
    "keyInvalid"
  ) {

    message =
      "Your YouTube API key is invalid.";

  }


  $("contentArea").innerHTML =
    `<div class="empty">
      ${escapeHTML(message)}
    </div>`;

}


/* =========================================================
   RESTORE LAST VIDEO
   ========================================================= */

function restoreLastVideo() {

  const saved =
    localStorage.getItem(
      "ft_current_video"
    );


  if (!saved) return;


  try {

    const video =
      JSON.parse(saved);


    /*
      We don't automatically open it.
      Instead it becomes the Continue
      studying card.
    */

    if (
      !history.some(
        v => v.id === video.id
      )
    ) {

      history.unshift(
        video
      );

      history =
        history.slice(0,100);

      setJSON(
        "ft_history",
        history
      );

    }

  } catch {

    /* ignore corrupted storage */

  }

}


/* =========================================================
   INITIALIZE
   ========================================================= */

updateGreeting();

loadTheme();

restoreLastVideo();

updateContinueCard();

updateFocusTime();

</script>
