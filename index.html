<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>FocusTube</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   FOCUSTUBE — DESIGN SYSTEM
   ========================================================= */

:root {
  --bg: #f4f1ea;
  --surface: rgba(255,255,255,0.72);
  --surface-solid: #ffffff;
  --surface-soft: rgba(255,255,255,0.45);

  --text: #191a1c;
  --muted: #74746f;

  --line: rgba(25,25,25,0.08);

  --accent: #9b7044;
  --accent-soft: rgba(155,112,68,0.12);

  --shadow:
    0 12px 35px rgba(38,34,27,0.08),
    0 2px 8px rgba(38,34,27,0.04);

  --radius: 18px;
}

body.dark {

  --bg: #0e100f;
  --surface: rgba(25,27,25,0.76);
  --surface-solid: #191b19;
  --surface-soft: rgba(35,37,34,0.55);

  --text: #ecebe5;
  --muted: #9b9c96;

  --line: rgba(255,255,255,0.07);

  --accent: #d5a86d;
  --accent-soft: rgba(213,168,109,0.12);

  --shadow:
    0 18px 45px rgba(0,0,0,0.32),
    0 2px 10px rgba(0,0,0,0.18);
}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: var(--text);
  background: var(--bg);

  min-height: 100vh;

  transition:
    background 0.35s ease,
    color 0.35s ease;

  overflow-x: hidden;
}


/* =========================================================
   AMBIENT BACKGROUND
   ========================================================= */

.ambient {
  position: fixed;
  inset: -20%;
  pointer-events: none;
  z-index: -2;

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(214,173,112,0.15),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(130,150,130,0.10),
      transparent 28%
    );

  filter: blur(40px);

  animation:
    ambientMove 18s ease-in-out infinite alternate;
}

body.dark .ambient {
  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(215,164,94,0.10),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(100,130,115,0.07),
      transparent 28%
    );
}

@keyframes ambientMove {

  from {
    transform: translate3d(-2%, -1%, 0) scale(1);
  }

  to {
    transform: translate3d(2%, 2%, 0) scale(1.04);
  }
}


/* subtle paper texture */

.texture {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;

  opacity: 0.035;

  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {

  position: sticky;
  top: 0;

  height: 70px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 22px;

  z-index: 50;

  background:
    color-mix(
      in srgb,
      var(--bg) 76%,
      transparent
    );

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border-bottom: 1px solid var(--line);
}

.brand {

  display: flex;
  align-items: center;
  gap: 10px;

  font-size: 16px;
  font-weight: 500;

  letter-spacing: -0.3px;
}

.brand-dot {

  width: 10px;
  height: 10px;

  border-radius: 50%;

  background: var(--accent);

  box-shadow:
    0 0 18px rgba(180,130,75,0.35);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {

  width: 40px;
  height: 40px;

  border: 0;
  border-radius: 12px;

  background: var(--surface);

  color: var(--text);

  cursor: pointer;

  box-shadow: var(--shadow);

  font-size: 17px;

  transition:
    transform .18s ease,
    background .18s ease;
}

.icon-btn:active {
  transform: scale(.94);
}


/* =========================================================
   APP CONTAINER
   ========================================================= */

.app {

  width: min(1180px, 100%);

  margin: 0 auto;

  padding:
    0 22px 80px;
}


/* =========================================================
   HOME
   ========================================================= */

.home {

  min-height: calc(100vh - 70px);

  display: flex;
  flex-direction: column;

  justify-content: center;

  padding:
    50px 0 90px;
}

.greeting {

  color: var(--muted);

  font-size: 14px;

  margin-bottom: 10px;
}

.home-title {

  font-size: clamp(34px, 5vw, 58px);

  font-weight: 400;

  letter-spacing: -2.4px;

  line-height: 1.04;

  max-width: 720px;

  margin: 0 0 34px;
}

.home-title span {
  color: var(--muted);
}


/* =========================================================
   SEARCH
   ========================================================= */

.search-wrap {

  width: min(760px, 100%);
}

.search-box {

  display: flex;
  align-items: center;

  min-height: 62px;

  padding: 6px;

  border-radius: 18px;

  background: var(--surface);

  border: 1px solid var(--line);

  box-shadow: var(--shadow);

  backdrop-filter: blur(16px);
}

.search-box input {

  flex: 1;

  min-width: 0;

  border: 0;
  outline: 0;

  background: transparent;

  color: var(--text);

  padding: 0 16px;

  font-size: 16px;

  font-family: inherit;
}

.search-box input::placeholder {
  color: var(--muted);
}

.search-button {

  border: 0;

  min-height: 50px;

  padding: 0 22px;

  border-radius: 14px;

  background: var(--text);

  color: var(--bg);

  font-family: inherit;

  font-weight: 500;

  cursor: pointer;
}


/* =========================================================
   HOME SECTIONS
   ========================================================= */

.home-section {

  margin-top: 58px;
}

.section-header {

  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 18px;
}

.section-title {

  font-size: 15px;

  font-weight: 500;

  letter-spacing: -0.2px;
}

.section-link {

  color: var(--muted);

  font-size: 13px;

  cursor: pointer;
}


/* =========================================================
   CONTINUE CARD
   ========================================================= */

.continue-card {

  width: 100%;

  display: grid;

  grid-template-columns: minmax(220px, 0.75fr) 1fr;

  overflow: hidden;

  border-radius: 20px;

  background: var(--surface);

  border: 1px solid var(--line);

  box-shadow: var(--shadow);

  cursor: pointer;
}

.continue-thumb {

  aspect-ratio: 16/9;

  width: 100%;

  object-fit: cover;
}

.continue-info {

  padding: 26px;

  display: flex;

  flex-direction: column;

  justify-content: center;
}

.continue-label {

  color: var(--muted);

  font-size: 12px;

  margin-bottom: 10px;
}

.continue-title {

  font-size: 20px;

  line-height: 1.35;

  margin-bottom: 8px;
}

.progress-track {

  height: 4px;

  width: 100%;

  margin-top: 18px;

  border-radius: 20px;

  background: var(--line);

  overflow: hidden;
}

.progress-bar {

  height: 100%;

  width: 0%;

  background: var(--accent);
}


/* =========================================================
   TODAY FOCUS
   ========================================================= */

.focus-card {

  display: flex;

  align-items: center;

  gap: 22px;

  padding: 24px;

  border-radius: 20px;

  background: var(--surface);

  border: 1px solid var(--line);

  box-shadow: var(--shadow);
}

.focus-number {

  font-size: 34px;

  font-weight: 400;

  letter-spacing: -1px;
}

.focus-label {

  color: var(--muted);

  font-size: 13px;
}


/* =========================================================
   PAGE HEADER
   ========================================================= */

.page-header {

  padding: 42px 0 26px;
}

.page-title {

  font-size: 30px;

  font-weight: 400;

  letter-spacing: -1px;

  margin: 0;
}

.page-subtitle {

  color: var(--muted);

  margin-top: 7px;

  font-size: 13px;
}


/* =========================================================
   VIDEO GRID
   ========================================================= */

.video-grid {

  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 26px 20px;
}

.video-card {

  min-width: 0;

  cursor: pointer;
}

.thumbnail-wrap {

  position: relative;

  overflow: hidden;

  border-radius: 15px;

  background: #111;

  aspect-ratio: 16/9;

  box-shadow: var(--shadow);
}

.thumbnail {

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

  transition:
    transform .35s ease;
}

.video-card:hover .thumbnail {

  transform: scale(1.025);
}

.duration {

  position: absolute;

  right: 8px;
  bottom: 8px;

  padding: 4px 6px;

  border-radius: 6px;

  background: rgba(0,0,0,.75);

  color: white;

  font-size: 11px;
}

.video-info {

  padding: 12px 2px;
}

.video-title {

  font-size: 14px;

  line-height: 1.4;

  font-weight: 500;

  display: -webkit-box;

  -webkit-line-clamp: 2;

  -webkit-box-orient: vertical;

  overflow: hidden;
}

.channel-name {

  margin-top: 7px;

  color: var(--muted);

  font-size: 12px;

  cursor: pointer;

  width: fit-content;
}

.channel-name:hover {
  color: var(--accent);
}

.video-meta {

  margin-top: 6px;

  color: var(--muted);

  font-size: 11px;
}

.video-description {

  margin-top: 8px;

  color: var(--muted);

  font-size: 11px;

  line-height: 1.45;

  display: -webkit-box;

  -webkit-line-clamp: 2;

  -webkit-box-orient: vertical;

  overflow: hidden;
}


/* =========================================================
   LOAD MORE
   ========================================================= */

.load-more-wrap {

  display: flex;

  justify-content: center;

  padding: 45px 0;
}

.load-more {

  border: 1px solid var(--line);

  background: var(--surface);

  color: var(--text);

  border-radius: 14px;

  padding: 12px 22px;

  font-family: inherit;

  cursor: pointer;

  box-shadow: var(--shadow);
}


/* =========================================================
   PLAYER
   ========================================================= */

.player {

  display: none;

  padding: 24px 0 60px;
}

.player.active {
  display: block;
}

.player-shell {

  border-radius: 20px;

  overflow: hidden;

  background: #000;

  box-shadow:
    0 25px 70px rgba(0,0,0,.20);
}

.player-frame {

  width: 100%;

  aspect-ratio: 16/9;

  display: block;

  border: 0;
}

.player-details {

  padding: 24px 0;
}

.player-title {

  font-size: 23px;

  line-height: 1.35;

  font-weight: 500;
}

.player-channel {

  color: var(--muted);

  margin-top: 8px;

  font-size: 13px;
}

.player-actions {

  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  margin-top: 18px;
}

.action {

  border: 1px solid var(--line);

  background: var(--surface);

  color: var(--text);

  padding: 10px 15px;

  border-radius: 12px;

  font-family: inherit;

  cursor: pointer;
}

.action.active {

  background: var(--accent-soft);

  color: var(--accent);

  border-color: transparent;
}


/* =========================================================
   CHANNEL PAGE
   ========================================================= */

.channel-header {

  padding: 40px 0 28px;

  border-bottom: 1px solid var(--line);

  margin-bottom: 28px;
}

.channel-title {

  font-size: 32px;

  font-weight: 400;

  letter-spacing: -1px;

  margin: 0;
}

.channel-description {

  max-width: 650px;

  color: var(--muted);

  line-height: 1.6;

  font-size: 13px;

  margin-top: 10px;
}

.channel-tabs {

  display: flex;

  gap: 20px;

  margin-top: 24px;
}

.channel-tab {

  color: var(--muted);

  font-size: 13px;

  cursor: pointer;
}

.channel-tab.active {
  color: var(--text);
}


/* =========================================================
   LIBRARY
   ========================================================= */

.library-tabs {

  display: flex;

  gap: 8px;

  flex-wrap: wrap;

  margin-bottom: 25px;
}

.library-tab {

  border: 1px solid var(--line);

  background: var(--surface);

  color: var(--muted);

  padding: 9px 14px;

  border-radius: 11px;

  font-family: inherit;

  cursor: pointer;
}

.library-tab.active {

  background: var(--text);

  color: var(--bg);
}


/* =========================================================
   DRAWER
   ========================================================= */

.drawer-overlay {

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,.25);

  backdrop-filter: blur(3px);

  z-index: 80;

  display: none;
}

.drawer-overlay.open {
  display: block;
}

.drawer {

  position: fixed;

  top: 0;
  left: 0;

  height: 100vh;

  width: min(310px, 88vw);

  background: var(--surface-solid);

  border-right: 1px solid var(--line);

  z-index: 81;

  padding: 25px;

  transform: translateX(-105%);

  transition: transform .3s ease;

  box-shadow: 15px 0 50px rgba(0,0,0,.12);
}

.drawer.open {
  transform: translateX(0);
}

.drawer-brand {

  font-size: 17px;

  margin-bottom: 35px;
}

.drawer-item {

  display: flex;

  align-items: center;

  gap: 12px;

  padding: 13px 10px;

  border-radius: 11px;

  color: var(--muted);

  cursor: pointer;

  font-size: 14px;
}

.drawer-item:hover {

  background: var(--accent-soft);

  color: var(--text);
}

.drawer-divider {

  height: 1px;

  background: var(--line);

  margin: 18px 0;
}


/* =========================================================
   EMPTY / LOADING
   ========================================================= */

.empty {

  padding: 80px 20px;

  text-align: center;

  color: var(--muted);

  font-size: 14px;
}

.loading {

  padding: 60px 20px;

  text-align: center;

  color: var(--muted);
}


/* =========================================================
   TOAST
   ========================================================= */

.toast {

  position: fixed;

  bottom: 25px;
  left: 50%;

  transform:
    translateX(-50%)
    translateY(20px);

  opacity: 0;

  pointer-events: none;

  background: var(--text);

  color: var(--bg);

  padding: 11px 16px;

  border-radius: 12px;

  font-size: 12px;

  z-index: 200;

  transition: .25s ease;
}

.toast.show {

  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 900px) {

  .video-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 650px) {

  .app {
    padding-left: 15px;
    padding-right: 15px;
  }

  .topbar {
    padding: 0 15px;
  }

  .home {
    min-height: auto;
    padding-top: 90px;
  }

  .home-title {
    font-size: 40px;
  }

  .continue-card {
    grid-template-columns: 1fr;
  }

  .video-grid {
    grid-template-columns: 1fr;
    gap: 28px;
  }

  .player-title {
    font-size: 19px;
  }
}

</style>
</head>


<body>

<div class="ambient"></div>
<div class="texture"></div>


<!-- =====================================================
     TOP BAR
     ===================================================== -->

<header class="topbar">

  <div class="brand">

    <span class="brand-dot"></span>

    <span>FocusTube</span>

  </div>


  <div class="top-actions">

    <button
      class="icon-btn"
      onclick="toggleTheme()"
      aria-label="Toggle theme">

      ◐

    </button>

    <button
      class="icon-btn"
      onclick="openDrawer()"
      aria-label="Open menu">

      ☰

    </button>

  </div>

</header>


<!-- =====================================================
     DRAWER
     ===================================================== -->

<div
  class="drawer-overlay"
  id="drawerOverlay"
  onclick="closeDrawer()">
</div>


<aside class="drawer" id="drawer">

  <div class="drawer-brand">
    FocusTube
  </div>


  <div
    class="drawer-item"
    onclick="goHome()">

    ⌂
    Home

  </div>


  <div
    class="drawer-item"
    onclick="openLibrary('watchlater')">

    🔖
    Watch Later

  </div>


  <div
    class="drawer-item"
    onclick="openLibrary('liked')">

    ♡
    Liked

  </div>


  <div
    class="drawer-item"
    onclick="openLibrary('history')">

    ◷
    History

  </div>


  <div class="drawer-divider"></div>


  <div
    class="drawer-item"
    onclick="toggleTheme()">

    ◐
    Light / Dark

  </div>

</aside>


<!-- =====================================================
     MAIN APP
     ===================================================== -->

<div class="app">


  <!-- ================= HOME ================= -->

  <section id="homeView" class="home">

    <div class="greeting" id="greeting">
      Good evening.
    </div>

    <h1 class="home-title">

      What would you like
      <span>to learn?</span>

    </h1>


    <div class="search-wrap">

      <div class="search-box">

        <input
          id="searchInput"
          type="text"
          autocomplete="off"
          placeholder="Search something..."
          onkeydown="handleSearchKey(event)"
        >

        <button
          class="search-button"
          onclick="performSearch()">

          Search

        </button>

      </div>

    </div>


    <!-- CONTINUE -->

    <div
      id="continueSection"
      class="home-section"
      style="display:none;">

      <div class="section-header">

        <div class="section-title">
          Continue studying
        </div>

        <div
          class="section-link"
          onclick="openLibrary('history')">

          View history →

        </div>

      </div>


      <div
        id="continueCard"
        class="continue-card">
      </div>

    </div>


    <!-- TODAY -->

    <div class="home-section">

      <div class="section-header">

        <div class="section-title">
          Today's focus
        </div>

      </div>


      <div class="focus-card">

        <div
          class="focus-number"
          id="focusTime">

          0m

        </div>

        <div>

          <div class="focus-label">
            study time today
          </div>

        </div>

      </div>

    </div>

  </section>


  <!-- ================= CONTENT ================= -->

  <section id="contentView" style="display:none;">

    <div class="page-header">

      <h2
        class="page-title"
        id="pageTitle">
      </h2>

      <div
        class="page-subtitle"
        id="pageSubtitle">
      </div>

    </div>


    <div
      id="contentArea">
    </div>

  </section>


  <!-- ================= PLAYER ================= -->

  <section
    id="playerView"
    class="player">

    <div
      class="player-shell">

      <iframe
        id="youtubePlayer"
        class="player-frame"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>

    </div>


    <div class="player-details">

      <div
        class="player-title"
        id="playerTitle">
      </div>

      <div
        class="player-channel"
        id="playerChannel">
      </div>


      <div class="player-actions">

        <button
          class="action"
          id="likeButton"
          onclick="toggleLike()">

          ♡ Like

        </button>


        <button
          class="action"
          id="watchLaterButton"
          onclick="toggleWatchLater()">

          🔖 Watch Later

        </button>


        <button
          class="action"
          onclick="closePlayer()">

          ← Back

        </button>
